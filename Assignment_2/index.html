<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSECT - Pachyteria equestris</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">

        <div class="left-side">
            <header class="top-bar">
                <h1 class="logo">INSECT</h1>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search...">
                </div>
            </header>

            <div class="content-left">
                <h2 class="vertical-title">Classification</h2>
                
                <div class="classification-list">
                    <div class="class-item">
                        <span class="dot"></span>
                        <div class="class-text">
                            <span class="label">Class:</span>
                            <span class="value">Insecta</span>
                        </div>
                    </div>
                    <div class="class-item">
                        <span class="dot"></span>
                        <div class="class-text">
                            <span class="label">Order:</span>
                            <span class="value">Coleoptera</span>
                        </div>
                    </div>
                    <div class="class-item">
                        <span class="dot"></span>
                        <div class="class-text">
                            <span class="label">Family:</span>
                            <span class="value">Cerambycidae</span>
                        </div>
                    </div>
                    <div class="class-item">
                        <span class="dot"></span>
                        <div class="class-text">
                            <span class="label">Sub-Family:</span>
                            <span class="value">Cerambycinae</span>
                        </div>
                    </div>
                    <div class="class-item">
                        <span class="dot"></span>
                        <div class="class-text">
                            <span class="label">Tribe:</span>
                            <span class="value">Callichromatini</span>
                        </div>
                    </div>
                    <div class="class-item">
                        <span class="dot"></span>
                        <div class="class-text">
                            <span class="label">Genus:</span>
                            <span class="value">Pachyteria</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="specimen-container">
            <img src="beetel-removebg-preview.png" alt="Pachyteria equestris Specimen" class="specimen-img">
        </div>

        <div class="right-side">
            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">Shop</a>
                <a href="#">About</a>
                <a href="#">Gallery</a>
                <a href="#">Contact</a>
            </nav>

            <div class="content-right">
                <div class="title-group">
                    <h2>Pachyteria</h2>
                    <h2>equestris</h2>
                </div>

                <div class="info-grid-section">
                    <div class="beetle-graphic-col">

                        <img class="beetle-icon" src="beetel_logo-removebg-preview.png" alt="Beetel logo">
                        <span class="size-label-sub">32 mm</span>
                    </div>

                    <div class="specimen-stats">
                        <div class="stat-row">
                            <i class="fa-solid fa-location-dot"></i>
                            <div>
                                <span class="stat-label">Locality:</span>
                                <span class="stat-val">Malaysia</span>
                            </div>
                        </div>
                        <div class="stat-row">
                            <i class="fa-solid fa-mars"></i>
                            <div>
                                <span class="stat-label">Sex:</span>
                                <span class="stat-val">Male</span>
                            </div>
                        </div>
                        <div class="stat-row">
                            <i class="fa-solid fa-ruler"></i>
                            <div>
                                <span class="stat-label">Size:</span>
                                <span class="stat-val">32 mm / 12 mm</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="price-section">
                    <span class="price">$5.99</span>
                </div>

                <div class="toggles">
                    <label class="switch-label">
                        <input type="checkbox">
                        <span class="slider"></span>
                        View detailed antennae
                    </label>
                    <label class="switch-label">
                        <input type="checkbox">
                        <span class="slider"></span>
                        View underside
                    </label>
                </div>

                <button class="btn-collect">Add to collection</button>
            </div>
        </div>
    </div>

</body>
</html>
